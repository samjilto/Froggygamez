<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101813" />
    <meta name="description" content="Froggy — a cozy home for your favorite games." />
    <meta name="google-adsense-account" content="ca-pub-4386160713272293" />

    <header class="topbar">

        <img class="brand-logo" src="/assets/froggy-mascot.png?v=2" alt="" />

      <label class="search-box" for="game-search">

    <main id="app" class="app-main" tabindex="-1">
    </main>
    <script type="module" src="/app.js?v=13"></script>
